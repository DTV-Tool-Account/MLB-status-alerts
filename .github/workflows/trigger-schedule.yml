name: Trigger MLB Check

on:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Trigger workflow via API
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/check-9th-inning.yml/dispatches \
            -d '{"ref":"main"}'
